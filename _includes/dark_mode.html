<style>
/* Dark Mode Toggle Button */
.dark-mode-toggle {
    background: transparent;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #4b5563;
    transition: transform 0.3s;
    margin-right: 15px;
    display: flex;
    align-items: center;
}
.dark-mode-toggle:hover {
    transform: scale(1.1);
}
</style>

<button id="dark-mode-btn" class="dark-mode-toggle" aria-label="Toggle Dark Mode" aria-pressed="false" title="Toggle Dark Mode">
    🌙
</button>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('dark-mode-btn');
    const storedTheme = localStorage.getItem('theme');
    
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = storedTheme === 'dark' || (storedTheme === null && prefersDark);
    
    if (isDark) {
        document.body.classList.add('dark-theme');
        btn.textContent = '☀️';
        btn.setAttribute('aria-pressed', 'true');
    }

    btn.addEventListener('click', () => {
        document.body.classList.toggle('dark-theme');
        const isNowDark = document.body.classList.contains('dark-theme');
        btn.setAttribute('aria-pressed', isNowDark);
        
        if (isNowDark) {
            localStorage.setItem('theme', 'dark');
            btn.textContent = '☀️';
        } else {
            localStorage.setItem('theme', 'light');
            btn.textContent = '🌙';
        }
    });
});
</script>
