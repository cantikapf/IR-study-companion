<style>
.quiz-container {
    background: var(--surface-bg, #ffffff);
    border: 1px solid var(--border-hairline, rgba(0, 0, 0, 0.1));
    border-radius: var(--radius-card, 14px);
    padding: 1.75rem;
    margin: 2.5rem 0;
    box-shadow: var(--shadow-elevation-1, 0 1px 2px rgba(0, 0, 0, 0.04));
    font-family: inherit;
    color: inherit;
}
.quiz-header-badge {
    font-size: 0.725rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-tertiary, #666666);
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-bottom: 0.85rem;
}
.quiz-header-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-primary, #000000);
}
.quiz-question {
    font-size: 1.1rem;
    font-weight: 650;
    margin-bottom: 1.25rem;
    line-height: 1.45;
    color: var(--ink-primary, #000000);
    text-wrap: balance;
}
.quiz-options {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
}
.quiz-option {
    padding: 0.95rem 1.15rem;
    border-radius: var(--radius-inner, 8px);
    background: var(--surface-bg, #ffffff);
    border: 1px solid var(--border-hairline, rgba(0, 0, 0, 0.1));
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    font-weight: 500;
    font-size: 0.95rem;
    line-height: 1.45;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    min-height: 48px;
    color: var(--ink-secondary, #333333);
}
.quiz-option:hover {
    background: var(--surface-hover, rgba(0, 0, 0, 0.04));
    border-color: var(--border-strong, rgba(0, 0, 0, 0.18));
}
.quiz-option.selected {
    border-color: var(--ink-primary, #000000);
    background: var(--surface-pressed, rgba(0, 0, 0, 0.08));
    color: var(--ink-primary, #000000);
}
.quiz-option.correct {
    border-color: var(--semantic-success-border, rgba(16, 185, 129, 0.3));
    background: var(--semantic-success-bg, rgba(16, 185, 129, 0.1));
    color: var(--semantic-success-ink, rgb(5, 150, 105));
    font-weight: 600;
}
.quiz-option.wrong {
    border-color: var(--semantic-error-border, rgba(239, 68, 68, 0.25));
    background: var(--semantic-error-bg, rgba(239, 68, 68, 0.08));
    color: var(--semantic-error-ink, rgb(220, 38, 38));
}
.quiz-submit {
    margin-top: 1.25rem;
    padding: 0.65rem 1.4rem;
    background: var(--brand-accent, #111827);
    color: var(--brand-accent-contrast, #ffffff);
    border: none;
    border-radius: var(--radius-inner, 8px);
    font-weight: 600;
    font-size: 0.875rem;
    cursor: pointer;
    min-height: 44px;
    transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
}
.quiz-submit:hover {
    opacity: 0.92;
    transform: translateY(-1px);
}
.quiz-feedback {
    margin-top: 1rem;
    padding: 0.95rem 1.15rem;
    border-radius: var(--radius-inner, 8px);
    font-size: 0.875rem;
    display: none;
    line-height: 1.5;
}
.quiz-feedback.show-correct {
    display: block;
    background: var(--semantic-success-bg, rgba(16, 185, 129, 0.1));
    border: 1px solid var(--semantic-success-border, rgba(16, 185, 129, 0.3));
    color: var(--semantic-success-ink, rgb(5, 150, 105));
}
.quiz-feedback.show-wrong {
    display: block;
    background: var(--semantic-error-bg, rgba(239, 68, 68, 0.08));
    border: 1px solid var(--semantic-error-border, rgba(239, 68, 68, 0.25));
    color: var(--semantic-error-ink, rgb(220, 38, 38));
}
.quiz-explanation-box {
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px dashed rgba(0, 0, 0, 0.15);
    font-size: 0.85rem;
    line-height: 1.55;
    color: var(--lms-ink-secondary, #333333);
}
body.dark-theme .quiz-explanation-box {
    border-top-color: rgba(255, 255, 255, 0.15);
    color: var(--lms-ink-secondary, #e0e0e0);
}
.quiz-explanation-title {
    font-weight: 700;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
    color: var(--lms-ink-primary, #000);
}
body.dark-theme .quiz-explanation-title {
    color: var(--lms-ink-primary, #ffffff);
}
.quiz-ref-link {
    display: inline-block;
    margin-top: 0.5rem;
    font-weight: 600;
    color: inherit;
    text-decoration: underline;
    font-size: 0.825rem;
}
</style>

<div class="quiz-container" id="quiz-{{ include.id }}" aria-label="Knowledge Checkpoint">
    <div class="quiz-header-badge">Knowledge Checkpoint</div>
    <div class="quiz-question">{{ include.question }}</div>
    <div class="quiz-options" role="radiogroup">
        <div class="quiz-option" data-idx="1" tabindex="0" role="radio" aria-checked="false">{{ include.opt1 }}</div>
        <div class="quiz-option" data-idx="2" tabindex="0" role="radio" aria-checked="false">{{ include.opt2 }}</div>
        <div class="quiz-option" data-idx="3" tabindex="0" role="radio" aria-checked="false">{{ include.opt3 }}</div>
        <div class="quiz-option" data-idx="4" tabindex="0" role="radio" aria-checked="false">{{ include.opt4 }}</div>
    </div>
    <button class="quiz-submit" onclick="submitQuiz('{{ include.id }}', '{{ include.correct }}')">Verify Answer</button>
    <div class="quiz-feedback" id="feedback-{{ include.id }}" aria-live="polite"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const quizId = '{{ include.id }}';
    const container = document.getElementById('quiz-' + quizId);
    if(!container) return;
    
    const explanationText = {{ include.explanation | default: "" | jsonify }};
    const refSection = {{ include.ref_section | default: "" | jsonify }};

    function renderExplanation(isCorrect) {
        if (!explanationText) return "";
        let html = '<div class="quiz-explanation-box">';
        html += '<div class="quiz-explanation-title"><i class="fa fa-info-circle"></i> Scholarly Context & Rationale</div>';
        html += '<div>' + explanationText + '</div>';
        if (refSection) {
            html += '<a href="#' + refSection + '" class="quiz-ref-link">Jump to referenced lesson passage &uarr;</a>';
        }
        html += '</div>';
        return html;
    }
    
    // Check local storage
    const isCompleted = localStorage.getItem('quiz_' + quizId + '_completed');
    if(isCompleted) {
        const correctIdx = '{{ include.correct }}';
        const opt = container.querySelector('.quiz-option[data-idx="'+correctIdx+'"]');
        if(opt) {
            opt.classList.add('correct');
        }
        const btn = container.querySelector('.quiz-submit');
        if(btn) btn.style.display = 'none';
        const feedback = document.getElementById('feedback-' + quizId);
        if(feedback) {
            feedback.innerHTML = "Completed! You have already verified this question correctly. &check;" + renderExplanation(true);
            feedback.className = 'quiz-feedback show-correct';
        }
    }

    const options = container.querySelectorAll('.quiz-option');
    options.forEach(opt => {
        const selectOption = () => {
            if(localStorage.getItem('quiz_' + quizId + '_completed')) return;
            options.forEach(o => {
                o.classList.remove('selected');
                o.setAttribute('aria-checked', 'false');
            });
            opt.classList.add('selected');
            opt.setAttribute('aria-checked', 'true');
        };
        opt.addEventListener('click', selectOption);
        opt.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                selectOption();
            }
        });
    });

    // Expose explanation helper to submitQuiz
    container._renderExplanation = renderExplanation;
});

function submitQuiz(id, correctIdx) {
    const container = document.getElementById('quiz-' + id);
    const selected = container.querySelector('.quiz-option.selected');
    const feedback = document.getElementById('feedback-' + id);
    
    if(!selected) {
        feedback.textContent = "Please select an option before submitting.";
        feedback.className = 'quiz-feedback show-wrong';
        return;
    }
    
    const explanationHtml = typeof container._renderExplanation === 'function' ? container._renderExplanation(true) : '';
    const selectedIdx = selected.getAttribute('data-idx');
    if(selectedIdx === correctIdx) {
        selected.classList.add('correct');
        selected.classList.remove('selected');
        feedback.innerHTML = "<strong>Correct!</strong> You have successfully mastered this core concept. &check;" + explanationHtml;
        feedback.className = 'quiz-feedback show-correct';
        
        // Save to local storage
        if (!localStorage.getItem('quiz_' + id + '_completed')) {
            localStorage.setItem('quiz_' + id + '_completed', 'true');
            window.dispatchEvent(new Event('quiz_completed'));
        }
        
        container.querySelector('.quiz-submit').style.display = 'none';
    } else {
        selected.classList.add('wrong');
        setTimeout(() => selected.classList.remove('wrong'), 800);
        feedback.innerHTML = "<strong>Incorrect.</strong> Review the core reading and try again." + (explanationHtml ? '<br><small>Tip: Re-read the relevant section to verify why this answer differs.</small>' : '');
        feedback.className = 'quiz-feedback show-wrong';
    }
}
</script>
