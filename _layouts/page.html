---
layout: default
---

<div class="lms-player-container" style="grid-template-columns: 1fr;">
  <div class="lms-prose-column" style="max-width: var(--lms-measure-prose); margin: 0 auto;">
    {% if page.title %}
      <header class="lesson-header-card">
        <h1 class="lesson-title">{{ page.title | escape }}</h1>
        {% if page.subtitle %}
          <div style="font-size: 1.1rem; color: var(--lms-ink-secondary); margin-top: -0.5rem;">{{ page.subtitle | escape }}</div>
        {% endif %}
      </header>
    {% endif %}

    <article class="course-prose-body">
      {{ content }}
    </article>
  </div>
</div>
