<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realism Isometric Simulation · The Security Dilemma</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Space Mono";
      src: url("fonts/SpaceMono-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Space Mono";
      src: url("fonts/SpaceMono-Bold.ttf") format("truetype");
      font-weight: 700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020306;
      font-family: "Space Mono", monospace;
      color: #fff;
    }

    /* FULL VIEWPORT STAGE */
    #stage-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding-bottom: 70px;
    }

    /* 1080x1920 CANVAS RIG */
    #viewport-scaler {
      position: absolute;
      width: 1080px;
      height: 1920px;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      transform: translate(-50%, -50%) scale(0.35);
      background: #05070c;
      border: 3px solid #38bdf8;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 0 120px rgba(0,0,0,0.95), 0 0 40px rgba(56, 189, 248, 0.25);
    }

    /* FLOATING HUD CONTROLLER */
    #hud-controls {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 14, 22, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 30px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 99999;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      font-size: 12px;
    }
    #hud-controls button {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-weight: 700;
      font-family: "Space Mono", monospace;
      cursor: pointer;
    }
    #hud-controls button:hover { background: #fff; }
    #hud-controls input[type="range"] {
      width: 160px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* ROOT COMPOSITION */
    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      background: #05070c;
      overflow: hidden;
    }

    /* CRT SCANLINE & VIGNETTE */
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 40;
      opacity: 0.6;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 50%, rgba(2, 4, 8, 0.85) 100%);
      pointer-events: none;
      z-index: 41;
    }

    /* TOP & BOTTOM TELEMETRY */
    .top-telemetry {
      position: absolute;
      top: 70px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #94a3b8;
      border-bottom: 2px solid rgba(255,255,255,0.12);
      padding-bottom: 16px;
      z-index: 50;
    }
    .top-telemetry .badge {
      background: #0284c7;
      color: #fff;
      padding: 4px 14px;
      border-radius: 4px;
      font-size: 16px;
      letter-spacing: 0.15em;
    }
    .bottom-telemetry {
      position: absolute;
      bottom: 70px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.08em;
      border-top: 2px solid rgba(255,255,255,0.1);
      padding-top: 16px;
      z-index: 50;
    }

    /* FLOATING TACTICAL LABELS IN ISOMETRIC SPACE */
    .tactical-tag {
      position: absolute;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 45;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: transform 0.2s;
    }
    .tag-alpha {
      background: rgba(14, 165, 233, 0.2);
      border: 1px solid #38bdf8;
      color: #38bdf8;
    }
    .tag-beta {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #f87171;
    }
    .tag-dmz {
      background: rgba(234, 179, 8, 0.2);
      border: 1px solid #eab308;
      color: #fde047;
    }

    /* TENSION METER PANEL */
    .tension-hud {
      position: absolute;
      top: 910px;
      left: 70px;
      width: 280px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 14px;
      z-index: 50;
    }
    .tension-hud .title {
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    .tension-hud .meter-bar {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .tension-hud .meter-fill {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #10b981, #eab308, #ef4444);
      transition: width 0.1s;
    }
    .tension-hud .val-row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    /* MAIN SVG CANVAS */
    #iso-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
    }
  </style>
</head>
<body>

  <!-- STAGE CONTAINER -->
  <div id="stage-container">

            <filter id="neon-red" x="-20%" y="-20%" width="140%" height="140%">

          </defs>

          <!-- 1. BASE ISOMETRIC GRID FLOOR -->
          <g id="iso-ground-grid" stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
            <!-- Isometric Diagonal Grid Lines across 1080x1920 -->
            <path d="
              M-200 600 L1280 1460 M-200 760 L1280 1620 M-200 920 L1280 1780 M-200 1080 L1280 1940 M-200 440 L1280 1300
              M-200 1460 L1280 600 M-200 1620 L1280 760 M-200 1780 L1280 920 M-200 1940 L1280 1080 M-200 1300 L1280 440
            "/>
            <!-- DMZ Dividing Line across the center (y ≈ 975) -->
            <line x1="40" y1="975" x2="1040" y2="975" stroke="#eab308" stroke-width="3" stroke-dasharray="16 10" opacity="0.6"/>
          </g>

          <!-- 2. DMZ FRICTION & TENSION SHOCKWAVE ZONE (Center: 540, 975) -->
          <g id="dmz-energy-zone">
            <ellipse id="dmz-spark-ring" cx="540" cy="975" rx="20" ry="12" fill="none" stroke="#facc15" stroke-width="4" opacity="0"/>
            <path id="dmz-arc-1" d="M460 975 Q540 940 620 975" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0"/>
            <path id="dmz-arc-2" d="M460 975 Q540 1010 620 975" fill="none" stroke="#ef4444" stroke-width="3" opacity="0"/>

          <!-- ======================================================== -->

          <g id="citadel-beta">

            <ellipse id="b-radar-wave" cx="540" cy="560" rx="40" ry="24" fill="none" stroke="#ef4444" stroke-width="3" opacity="0"/>

            <!-- Fortress Foundation Octagon (3-Tier Extrusion) -->
            <!-- Base Slab -->
            <polygon points="540,640 690,575 750,510 690,445 540,410 390,445 330,510 390,575" fill="#18181b" stroke="#27272a" stroke-width="2"/>
            <polygon points="330,510 390,575 390,605 330,540" fill="#09090b"/>
            <polygon points="390,575 540,640 540,670 390,605" fill="#101014"/>

            <polygon points="690,575 750,510 750,540 690,605" fill="#1c1c22"/>

            <!-- Mid Tier Slab (Crimson Border) -->

              <!-- Hatch Doors (Sliding L/R) -->
              <path id="b-s1-door-l" d="M-34 0 A34 20 0 0 1 0 -20 L0 20 A34 20 0 0 1 -34 0 Z" fill="#3f3f46" stroke="#ef4444" stroke-width="1.5"/>

              <!-- Subterranean Interceptor Missile (Hidden -> Rises) -->
              <g id="b-missile-1" transform="translate(0, 0)">
                <ellipse cx="0" cy="0" rx="14" ry="8" fill="#ef4444"/>
                <polygon points="-8,-4 8,-4 6,-55 -6,-55" fill="#e4e4e7" stroke="#71717a" stroke-width="1"/>
                <path d="M-6 -55 L0 -72 L6 -55 Z" fill="#ef4444"/>

            </g>

            <!-- Silo 2 (Center-Right) -->
            <g id="b-silo-2" transform="translate(630, 500)">
              <ellipse cx="0" cy="0" rx="34" ry="20" fill="#09090b" stroke="#71717a" stroke-width="2"/>
              <path id="b-s2-door-l" d="M-34 0 A34 20 0 0 1 0 -20 L0 20 A34 20 0 0 1 -34 0 Z" fill="#3f3f46" stroke="#ef4444" stroke-width="1.5"/>
              <path id="b-s2-door-r" d="M34 0 A34 20 0 0 0 0 -20 L0 20 A34 20 0 0 0 34 0 Z" fill="#52525b" stroke="#ef4444" stroke-width="1.5"/>
              <g id="b-missile-2" transform="translate(0, 0)">
                <ellipse cx="0" cy="0" rx="14" ry="8" fill="#ef4444"/>
                <polygon points="-8,-4 8,-4 6,-55 -6,-55" fill="#e4e4e7" stroke="#71717a" stroke-width="1"/>
                <path d="M-6 -55 L0 -72 L6 -55 Z" fill="#ef4444"/>
              </g>
            </g>

            <!-- Central Radar Tower on Beta (Pylon + Dish) -->
            <g id="b-radar-tower" transform="translate(540, 480)">
              <!-- Mast -->
              <line x1="0" y1="0" x2="0" y2="-70" stroke="#71717a" stroke-width="5"/>
              <line x1="-15" y1="0" x2="0" y2="-45" stroke="#52525b" stroke-width="3"/>
              <line x1="15" y1="0" x2="0" y2="-45" stroke="#52525b" stroke-width="3"/>
              <!-- Rotating Radar Dish -->
              <g id="b-radar-dish" transform="translate(0, -70)">
                <ellipse cx="0" cy="0" rx="28" ry="14" fill="#3f3f46" stroke="#ef4444" stroke-width="2"/>
                <line x1="0" y1="0" x2="0" y2="-22" stroke="#ef4444" stroke-width="3"/>

              <circle id="b-alarm-light" cx="0" cy="-35" r="7" fill="#ef4444" filter="url(#neon-red)"/>

            <!-- Protective Blast Shields (Deploy upward around Beta) -->
            <g id="b-shields">

              <polygon id="b-shield-r" points="720,540 690,570 690,520 720,490" fill="rgba(239,68,68,0.3)" stroke="#ef4444" stroke-width="2" opacity="0"/>

            <!-- Defensive Forcefield Bubble (Triggers on threat) -->
            <ellipse id="b-forcefield" cx="540" cy="530" rx="260" ry="160" fill="url(#dome-beta)" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6" opacity="0"/>
          </g>

          <!-- ======================================================== -->
          <!-- 4. THREAT PROPAGATION VECTORS (Alpha -> Beta)             -->
          <!-- ======================================================== -->
          <g id="threat-vectors">
            <!-- Concentric Expanding Wavefronts from Alpha to Beta -->
            <ellipse id="wave-1" cx="540" cy="1440" rx="50" ry="30" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0"/>
            <ellipse id="wave-2" cx="540" cy="1440" rx="50" ry="30" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0"/>

            <!-- High-Precision Tactical Laser Vector Line -->
            <line id="threat-beam" x1="540" y1="1400" x2="540" y2="560" stroke="#f87171" stroke-width="3" stroke-dasharray="12 8" opacity="0"/>
            <!-- Targeting Reticle Crosshair locking onto Beta -->
            <g id="target-reticle" transform="translate(540, 560)" opacity="0">

  <!-- FLOATING HUD CONTROLLER -->
  <div id="hud-controls">
    <button id="btn-play">PAUSE</button>
    <button id="btn-restart">RESTART</button>
    <button id="btn-audio">AUDIO: ON</button>
    <input type="range" id="scrubber" min="0" max="15" step="0.01" value="0">
    <span id="time-display" style="min-width: 110px; font-weight: 700;">0.00s / 15.00s</span>
  </div>

  <!-- GSAP ANIMATION RIG & SYNTHETIC AUDIO ENGINE -->
  <script>
    // --- 1. PROCEDURAL SOUND SYNTHESIZER ---
    class SimAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }
      // Heavy mechanical servo / hatch sliding
      servo() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(90, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(140, this.ctx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.65);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.65);
      }
      // Radar ping
      ping() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
      // Threat alert klaxon
      alarm() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(780, this.ctx.currentTime);
        osc.frequency.setValueAtTime(520, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
      // Deep sub-bass surge (forcefield collision)
      surge() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.8);
        gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.85);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.85);
      }
    }
    const audio = new SimAudio();

    // --- 2. RESPONSIVE AUTO-SCALER ---
    function fitStage() {
      const scaler = document.getElementById("viewport-scaler");
      if (!scaler) return;
      const w = window.innerWidth - 30;
      const h = window.innerHeight - 80;
      const scaleX = w / 1080;
      const scaleY = h / 1920;
      const scale = Math.min(scaleX, scaleY, 0.95);
      scaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener("resize", fitStage);
    window.addEventListener("DOMContentLoaded", fitStage);
    setTimeout(fitStage, 50);

    // --- 3. MASTER GSAP TIMELINE (15.00s Continuous Simulation Loop) ---
    const tl = gsap.timeline({
      paused: false,
      repeat: -1,
      onUpdate: () => {
        const t = tl.time();
        document.getElementById("scrubber").value = t;
        document.getElementById("time-display").textContent = `${t.toFixed(2)}s / 15.00s`;
      }
    });

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;

    // --- ACT 1: PEACEFUL EQUILIBRIUM & RADAR SWEEP (0.00s - 2.50s) ---
    // Radars idle rotating
    tl.to("#a-radar-dish", { rotation: 360, transformOrigin: "center center", duration: 3.5, ease: "none", repeat: 3 }, 0);
    tl.to("#b-radar-dish", { rotation: -360, transformOrigin: "center center", duration: 4.0, ease: "none", repeat: 3 }, 0);
    tl.set(["#tag-a", "#tag-b", "#tag-center"], { opacity: 0 }, 0);
    tl.set("#meter-fill", { width: "15%", backgroundColor: "#10b981" }, 0);
    document.getElementById("meter-val").textContent = "15%";
    document.getElementById("meter-val").style.color = "#10b981";

    // --- ACT 2: CITADEL ALPHA INITIATES DEFENSIVE DEPLOYMENT (2.50s - 5.50s) ---
    // Alpha announces silo opening
    tl.add(() => audio.servo(), 2.50);
    tl.to("#tag-a", { opacity: 1, duration: 0.4 }, 2.50);
    // Double hatch doors slide apart along isometric axis
    tl.to("#a-door-l", { x: -45, y: 25, duration: 1.2, ease: "power2.inOut" }, 2.60);
    tl.to("#a-door-r", { x: 45, y: -25, duration: 1.2, ease: "power2.inOut" }, 2.60);
    
    // Missile and elevator platform rise from underground (z-axis translation)
    tl.fromTo("#a-missile-rig", 
      { y: 80, opacity: 0.3 }, 
      { y: -30, opacity: 1, duration: 1.8, ease: "back.out(1.2)" }, 3.20
    );
    tl.to("#a-exhaust-glow", { opacity: 0.8, duration: 0.5 }, 4.00);

    // Alpha activates defensive bubble
    tl.to("#a-forcefield", { opacity: 0.7, scale: 1.05, transformOrigin: "540px 1420px", duration: 1.2, ease: "power2.out" }, 4.50);

    // Threat meter ticks upward (Alpha feels safer, but system tension begins)
    tl.to("#meter-fill", {
      width: "40%", duration: 1.5,
      onUpdate: () => {
        document.getElementById("meter-val").textContent = "40%";
        document.getElementById("meter-val").style.color = "#eab308";
      }
    }, 3.80);

    // --- ACT 3: THREAT SIGNATURE EXPANDS TO CITADEL BETA (5.50s - 8.50s) ---
    // Expanding radar threat rings travel across DMZ
    tl.add(() => audio.ping(), 5.50);
    tl.fromTo("#wave-1",
      { rx: 50, ry: 30, opacity: 0.8, y: 0 },
      { rx: 420, ry: 240, opacity: 0, y: -400, duration: 2.2, ease: "power1.out" }, 5.50
    );
    tl.add(() => audio.ping(), 6.20);
    tl.fromTo("#wave-2",
      { rx: 50, ry: 30, opacity: 0.9, y: 0 },
      { rx: 480, ry: 280, opacity: 0, y: -650, duration: 2.2, ease: "power1.out" }, 6.20
    );

    // Threat Vector locks onto Beta
    tl.to("#threat-beam", { opacity: 0.8, duration: 0.4 }, 6.80);
    tl.fromTo("#target-reticle", 
      { scale: 2.5, opacity: 0, rotation: 45 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(2)" }, 6.90
    );
    tl.add(() => audio.alarm(), 7.20);

    // --- ACT 4: CITADEL BETA REACTS // DEFENSIVE PARANOIA (8.50s - 11.50s) ---
    tl.to("#tag-b", { opacity: 1, duration: 0.4 }, 8.50);
    // Beta Alarm Klaxon flash
    tl.to("#b-alarm-light", { opacity: 1, scale: 2.2, yoyo: true, repeat: 5, duration: 0.15 }, 8.50);
    tl.add(() => audio.alarm(), 8.70);

    // Beta deploys protective armor shields
    tl.to(["#b-shield-l", "#b-shield-r"], { opacity: 1, y: -20, duration: 0.6, ease: "power3.out" }, 8.80);

    // Beta's MULTI-SILO opens simultaneously!
    tl.add(() => audio.servo(), 9.10);
    tl.to(["#b-s1-door-l", "#b-s2-door-l"], { x: -30, duration: 0.8, ease: "power2.inOut" }, 9.20);
    tl.to(["#b-s1-door-r", "#b-s2-door-r"], { x: 30, duration: 0.8, ease: "power2.inOut" }, 9.20);

    // Two Interceptor Missiles rise on Beta
    tl.fromTo(["#b-missile-1", "#b-missile-2"],
      { y: 50, opacity: 0 },
      { y: -35, opacity: 1, duration: 1.2, stagger: 0.2, ease: "back.out(1.5)" }, 9.50
    );

    // Beta activates rival forcefield bubble
    tl.to("#b-forcefield", { opacity: 0.75, scale: 1.05, transformOrigin: "540px 530px", duration: 1.2, ease: "power2.out" }, 10.00);

    // System threat spikes into Critical Red
    tl.to("#meter-fill", {
      width: "88%", duration: 1.4,
      onUpdate: () => {
        document.getElementById("meter-val").textContent = "88% CRITICAL";
        document.getElementById("meter-val").style.color = "#ef4444";
      }
    }, 9.20);

    // --- ACT 5: THE CLASH AT DMZ // SECURITY DILEMMA PEAK (11.50s - 14.50s) ---
    tl.to("#tag-center", { opacity: 1, duration: 0.4 }, 11.50);
    tl.add(() => audio.surge(), 11.60);

    // Both forcefields expand into the center and compress
    tl.to("#a-forcefield", { y: -160, duration: 1.0, ease: "power2.inOut" }, 11.70);
    tl.to("#b-forcefield", { y: 160, duration: 1.0, ease: "power2.inOut" }, 11.70);

    // Electric sparks / friction at the DMZ line
    tl.fromTo("#dmz-spark-ring",
      { rx: 20, ry: 10, opacity: 1 },
      { rx: 320, ry: 80, opacity: 0, duration: 0.8, ease: "power3.out" }, 12.00
    );
    tl.to(["#dmz-arc-1", "#dmz-arc-2"], { opacity: 0.9, duration: 0.1, yoyo: true, repeat: 7 }, 12.00);

    // Dial Needle shakes violently
    tl.to("#meter-fill", { width: "98%", duration: 0.5 }, 12.20);

    // --- ACT 6: SYSTEM COOL-DOWN / LOOP RESET (14.50s - 15.00s) ---
    tl.to(["#tag-a", "#tag-b", "#tag-center", "#threat-beam", "#target-reticle"], { opacity: 0, duration: 0.5 }, 14.30);
    tl.to(["#a-forcefield", "#b-forcefield"], { opacity: 0, y: 0, duration: 0.5 }, 14.30);
    tl.to(["#a-door-l", "#a-door-r", "#b-s1-door-l", "#b-s1-door-r", "#b-s2-door-l", "#b-s2-door-r"], { x: 0, y: 0, duration: 0.4 }, 14.40);
    tl.to(["#a-missile-rig", "#b-missile-1", "#b-missile-2"], { y: 60, opacity: 0, duration: 0.4 }, 14.40);

    // --- 4. HUMAN TESTER CONTROLS ---
    const btnPlay = document.getElementById("btn-play");
    btnPlay.addEventListener("click", () => {
      audio.init();
      if (tl.paused()) {
        tl.play();
        btnPlay.textContent = "PAUSE";
      } else {
        tl.pause();
        btnPlay.textContent = "PLAY";
      }
    });

    document.getElementById("btn-restart").addEventListener("click", () => {
      audio.init();
      tl.restart();
      btnPlay.textContent = "PAUSE";
    });

    const btnAudio = document.getElementById("btn-audio");
    btnAudio.addEventListener("click", () => {
      audio.init();
      audio.enabled = !audio.enabled;
      btnAudio.textContent = `AUDIO: ${audio.enabled ? "ON" : "OFF"}`;
      btnAudio.style.background = audio.enabled ? "#38bdf8" : "#475569";
    });

    document.getElementById("scrubber").addEventListener("input", (e) => {
      tl.pause();
      btnPlay.textContent = "PLAY";
      tl.time(parseFloat(e.target.value));
    });

    // Auto-init audio context on first click
    window.addEventListener("click", () => audio.init(), { once: true });

    // URL parameter seek support (?t=N)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("t")) {
      const seekTime = parseFloat(urlParams.get("t"));
      tl.pause();
      tl.time(seekTime);
      btnPlay.textContent = "PLAY";
    }
  </script>
</body>
</html>
