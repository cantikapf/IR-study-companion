<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TH-01 Short 26s Transparent Overlay</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@600;700;800&family=Space+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
    }
    #canvas-root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent !important;
    }

    /* Hook Ladder Elements */
    .hook-badge {
      position: absolute;
      left: 70px;
      right: 70px;
      height: 98px;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: 'Archivo Black', sans-serif;
      font-size: 40px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      border-radius: 12px;
      border: 4px solid #000000;
      box-shadow: 12px 12px 0px #000000;
      z-index: 30;
      opacity: 0;
    }
    #hook-1 { top: 180px; background: #ffe600; color: #000000; }
    #hook-2 { top: 295px; background: #b91c1c; color: #ffffff; border-color: #ffffff; }
    #hook-3 { top: 410px; background: #ffffff; color: #000000; }

    /* Precise Blueprint Leader Lines */
    .leader-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 35;
      display: none;
      opacity: 0;
    }
    .callout-badge {
      position: absolute;
      background: rgba(10, 15, 26, 0.92);
      border: 2px solid #fbbf24;
      border-radius: 8px;
      padding: 10px 20px;
      color: #ffffff;
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.85);
    }
    .callout-badge .dot {
      width: 10px;
      height: 10px;
      background: #fbbf24;
      border-radius: 50%;
      box-shadow: 0 0 8px #fbbf24;
    }

    /* Safe Area Subtitle Box: bottom: 220px */
    #subtitle-box {
      position: absolute;
      bottom: 220px;
      left: 80px;
      right: 80px;
      background: rgba(8, 12, 22, 0.94);
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 22px 30px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
      z-index: 50;
    }
    #subtitle-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.34;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    /* Outro Channel Badge */
    #channel-badge {
      position: absolute;
      top: 1160px;
      left: 140px;
      width: 800px;
      background: #e11d48;
      border: 3.5px solid #ffffff;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      color: #ffffff;
      font-family: 'Archivo Black', sans-serif;
      font-size: 30px;
      letter-spacing: 2px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.9);
      display: none;
      opacity: 0;
      z-index: 45;
    }
  </style>
</head>
<body>
<div id="canvas-root">
  <!-- Hook Ladder -->
  <div class="hook-badge" id="hook-1">30 GREEK SOLDIERS</div>
  <div class="hook-badge" id="hook-2">SEALED IN 35°C HEAT</div>
  <div class="hook-badge" id="hook-3">HOW DID THEY SURVIVE?</div>

  <!-- Precise Blueprint Leader Lines -->
  <div class="leader-container" id="precise-leaders">
    <!-- Tag 1: Upper Scaffolding Tier -->
    <div class="callout-badge" style="top: 730px; right: 70px;">
      <span class="dot"></span>
      <span>2 NARROW TIERS</span>
    </div>
    <svg style="position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none;">
      <polyline points="730,755 630,755 580,880" fill="none" stroke="#fbbf24" stroke-width="2.5" />
      <circle cx="580" cy="880" r="5" fill="#fbbf24" />
      <circle cx="580" cy="880" r="10" fill="none" stroke="rgba(251, 191, 36, 0.4)" stroke-width="2" />
    </svg>

    <!-- Tag 2: 30 Greek Warriors -->
    <div class="callout-badge" style="top: 1040px; left: 70px;">
      <span class="dot"></span>
      <span>30 GREEK WARRIORS</span>
    </div>
    <svg style="position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none;">
      <polyline points="380,1065 430,1065 480,1100" fill="none" stroke="#fbbf24" stroke-width="2.5" />
      <circle cx="480" cy="1100" r="5" fill="#fbbf24" />
      <circle cx="480" cy="1100" r="10" fill="none" stroke="rgba(251, 191, 36, 0.4)" stroke-width="2" />
    </svg>
  </div>

  <!-- Outro CTA Badge -->
  <div id="channel-badge">SUBSCRIBE // @IRinANutshell</div>

  <!-- Subtitle Box -->
  <div id="subtitle-box">
    <div id="subtitle-text">Inside this giant wooden horse outside Troy, thirty Greek soldiers were sealed alive in thirty-five-degree heat.</div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused: true });
  window.masterTl = tl;

  const sub = document.getElementById('subtitle-text');

  // =================================================================
  // SCENE 1 (0.00s - 10.03s): THE HOOK & CUTAWAY
  // Audio: Inside this giant wooden horse outside Troy...
  // =================================================================
  // Hook Ladder Pop-in (0.5s, 1.4s, 2.3s)
  tl.set('#hook-1', { display: 'flex' }, 0.5);
  tl.fromTo('#hook-1', { opacity: 0, scale: 1.4, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 0.28, ease: 'back.out(2)' }, 0.5);

  tl.set('#hook-2', { display: 'flex' }, 1.4);
  tl.fromTo('#hook-2', { opacity: 0, scale: 1.4, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 0.28, ease: 'back.out(2)' }, 1.4);

  tl.set('#hook-3', { display: 'flex' }, 2.3);
  tl.fromTo('#hook-3', { opacity: 0, scale: 1.4, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 0.28, ease: 'back.out(2)' }, 2.3);

  // Clear Hook Ladder at 4.2s
  tl.to(['#hook-1', '#hook-2', '#hook-3'], { opacity: 0, scale: 0.9, y: 20, duration: 0.25 }, 4.2);
  tl.set(['#hook-1', '#hook-2', '#hook-3'], { display: 'none' }, 4.45);

  // Subtitle switch at 4.5s
  tl.call(() => {
    sub.innerText = "The hollow pine belly held two cramped tiers where warriors sat in absolute silence.";
  }, null, 4.5);

  // Precise Leader Lines enter at 4.8s
  tl.set('#precise-leaders', { display: 'block' }, 4.8);
  tl.fromTo('#precise-leaders', { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1.0, duration: 0.45, ease: 'power3.out' }, 4.8);

  // Clear Leader Lines at 9.6s before scene cut
  tl.to('#precise-leaders', { opacity: 0, duration: 0.35, ease: 'power2.in' }, 9.6);
  tl.set('#precise-leaders', { display: 'none' }, 10.0);

  // =================================================================
  // SCENE 2 (10.03s - 18.03s): THE MIDNIGHT TRAPDOOR & ROPES
  // Audio: At midnight, Odysseus unlocked a spring-loaded trapdoor...
  // =================================================================
  tl.call(() => {
    sub.innerText = "At midnight, Odysseus unlocked a spring-loaded trapdoor beneath the horse, dropping hemp ropes to the cobblestones below.";
  }, null, 10.03);

  // Ensure center is 100% clean
  tl.set('#precise-leaders', { display: 'none', opacity: 0 }, 10.03);

  // =================================================================
  // SCENE 3 (18.03s - 25.73s): THE GATES OPEN & TROY FALLS
  // Audio: They slipped into the city, opened the gates, and ended a ten-year siege in a single night...
  // =================================================================
  tl.call(() => {
    sub.innerText = "They slipped into the city, opened the gates, and ended a ten-year siege in a single night.";
  }, null, 18.03);

  // CTA Outro at 22.0s
  tl.call(() => {
    sub.innerText = "Subscribe to IR in a Nutshell.";
  }, null, 22.0);

  tl.set('#channel-badge', { display: 'block', top: '1160px' }, 22.2);
  tl.fromTo('#channel-badge', { opacity: 0, scale: 0.85, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: 'back.out(2)' }, 22.2);
</script>
</body>
</html>
